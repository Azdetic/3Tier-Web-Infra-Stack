services:
  # 1. Frontend Web Server (Apache2)
  web:
    image: httpd:latest
    container_name: apache_web
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs/
    networks:
      - web_network
    depends_on:
      - db

  # 2. Backend Database Store (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: SuperSecretRoot2026!
      MYSQL_DATABASE: campus_info_db
      MYSQL_USER: infra_db_admin
      MYSQL_PASSWORD: SysP@ssW0rd!2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - web_network

  # 3. Web Status Probe (Blackbox Exporter)
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    ports:
      - "9115:9115"
    networks:
      - web_network

  # 4. Metrics Database (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - web_network
    depends_on:
      - blackbox

  # 5. Visualization Dashboard (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - web_network
    depends_on:
      - prometheus

networks:
  web_network:
    driver: bridge

volumes:
  db_data:
